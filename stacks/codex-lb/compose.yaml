name: codex-lb

services:
  codex-lb:
    # Operator-verified preview release, pinned by tag and OCI index digest.
    # This is an upstream pre-release; keep the previous stable image until the
    # response smoke test passes and follow README.md for upgrades.
    # Rollback image: ghcr.io/soju06/codex-lb:1.23.0@sha256:3b369ac16e03d31b940be35dd8e61583f9cbd74bfca5e92e4bd03bfec62e5b13
    image: ghcr.io/soju06/codex-lb:1.25.0-beta.1@sha256:80bb39434f53a3743a982ca810c59fceb9a2e2dcfb0e76b4d2feebf3ecf1c507
    container_name: codex-lb
    pull_policy: missing
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      CODEX_LB_CONNECT_ADDRESS: relay-ai.dongwontuna.net
      CODEX_LB_DATABASE_URL: postgresql+asyncpg://codex_lb:${CODEX_LB_POSTGRES_PASSWORD:?set in stacks/codex-lb/.env}@postgres:5432/codex_lb
      # Startup migration is intentional. A historical 1.19 rollback reused
      # revision 20260513 for two different physical schemas, so never stamp
      # that state by revision alone; use the README.md preflight matrix.
      CODEX_LB_DATABASE_MIGRATE_ON_STARTUP: "true"
      # v1.24.0 added anonymous usage telemetry that is ACTIVE while consent is
      # undecided. This relay is private, so opt out explicitly instead of
      # relying on the dashboard consent prompt.
      CODEX_LB_TELEMETRY_ENABLED: "false"
      # This is a single-user relay. Disable codex-lb's local per-account caps;
      # global admission limits and upstream/provider limits still apply.
      CODEX_LB_PROXY_ACCOUNT_RESPONSE_CREATE_LIMIT: "0"
      CODEX_LB_PROXY_ACCOUNT_STREAM_LIMIT: "0"
      # The background-task engine mirrors these two settings (its own
      # CODEX_LB_DATABASE_BACKGROUND_* knobs were removed upstream, issue
      # #1340), so the worst case is 2x(pool+overflow) connections:
      # 2x(40+20)=120, under the PG server's max_connections (200 below) with
      # headroom left for migrations, backups, and psql.
      CODEX_LB_DATABASE_POOL_SIZE: "40"
      CODEX_LB_DATABASE_MAX_OVERFLOW: "20"
      CODEX_LB_DASHBOARD_AUTH_MODE: standard
      CODEX_LB_LOG_FORMAT: text
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:2455:2455"
    volumes:
      - codex-lb-data:/var/lib/codex-lb

  postgres:
    image: postgres:18
    container_name: codex-lb-postgres
    restart: always
    # Headroom above the app pools (main 60 + mirrored background 60 = 120 max
    # clients).
    command: ["postgres", "-c", "max_connections=200"]
    # Docker's default 64MB /dev/shm makes parallel hash joins abort with
    # "could not resize shared memory segment", surfaced as asyncpg
    # DiskFullError on the request path (upstream PR #1791). This is a tmpfs
    # ceiling, not a reservation.
    shm_size: 1gb
    labels:
      # Pin the DB engine: never let watchtower auto-jump a Postgres major.
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      POSTGRES_DB: codex_lb
      POSTGRES_USER: codex_lb
      POSTGRES_PASSWORD: ${CODEX_LB_POSTGRES_PASSWORD:?set in stacks/codex-lb/.env}
    volumes:
      # PG18+ official image requires the mount at the parent dir; it stores data
      # in a major-version subdir (enables pg_upgrade --link). NOT /data.
      - codex-lb-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_lb -d codex_lb"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  codex-lb-data:
    external: true
    name: codex-lb-data
  codex-lb-postgres-data:
